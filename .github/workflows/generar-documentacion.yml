name: Generar y publicar documentación

'on':
  push:
    branches:
      - feature/generar-documentacion
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/generar-documentacion.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar documentación HTML
        run: mkdocs build --strict

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar documentación para publicar
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
